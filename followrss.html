        if (!channels.length) {
          this.outlet.innerHTML = `
            <div class="page-container">
              <div class="empty-state">
                <svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
                <div class="empty-title">Nenhum Feed Cadastrado</div>
                <p style="margin-bottom: 1.5rem;">Adicione seus podcasts e feeds RSS favoritos para começar a ouvir e ler!</p>
                <a href="#/library" class="btn btn-primary btn-pill">Adicionar Primeiro Feed</a>
              </div>
            </div>
          `;
          return;
        }

        // Base items matching search query (or all items if no query)
        let searchBase = this.cachedItems;
        if (this.searchQuery) {
          const q = this.searchQuery;
          searchBase = searchBase.filter(it => 
            (it.title && it.title.toLowerCase().includes(q)) ||
            (it.author && it.author.toLowerCase().includes(q)) ||
            (it.description && it.description.toLowerCase().includes(q))
          );
        }

        // Helper match functions
        const matchesStatus = (it, status) => {
          if (status === 'in_progress') return isItemInProgress(it);
          if (status === 'new') return isItemNew(it);
          if (status === 'completed') return isItemCompleted(it);
          return true; // 'all'
        };

        const matchesType = (it, type) => {
          if (type === 'podcasts') return it.isPodcast;
          if (type === 'articles') return !it.isPodcast;
          return true; // 'all'
        };

        // Counts for Content Type chips (reflecting current status filter and search query)
        const countTypeAll = searchBase.filter(it => matchesStatus(it, this.currentStatusFilter)).length;
        const countTypePodcasts = searchBase.filter(it => it.isPodcast && matchesStatus(it, this.currentStatusFilter)).length;
        const countTypeArticles = searchBase.filter(it => !it.isPodcast && matchesStatus(it, this.currentStatusFilter)).length;

        // Apply active category filter (Todos, Podcasts, Artigos)
        const typeFiltered = searchBase.filter(it => matchesType(it, this.currentFilter));

        // Counts for Status chips (reflecting current type filter and search query)
        const countStatusAll = typeFiltered.length;
        const countInProgress = typeFiltered.filter(it => isItemInProgress(it)).length;
        const countNew = typeFiltered.filter(it => isItemNew(it)).length;
        const countCompleted = typeFiltered.filter(it => isItemCompleted(it)).length;

        // Apply active status filter (Todos, Em Andamento, Novos, Concluídos)
        let filtered = typeFiltered.filter(it => matchesStatus(it, this.currentStatusFilter));

        const totalItems = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / this.itemsPerPage));
        if (this.currentPage > totalPages) this.currentPage = totalPages;

        const startIndex = (this.currentPage - 1) * this.itemsPerPage;
        const pageItems = filtered.slice(startIndex, startIndex + this.itemsPerPage);

        // Titles based on active filters or search state
        let pageTitle = 'Últimos Feeds & Podcasts';
        if (this.currentFilter === 'podcasts') pageTitle = 'Últimos Episódios de Podcasts';
        if (this.currentFilter === 'articles') pageTitle = 'Últimos Artigos & Notícias';

        if (this.currentStatusFilter === 'in_progress') {
          pageTitle = this.currentFilter === 'podcasts' ? 'Podcasts em Andamento' : 'Conteúdos em Andamento';
        } else if (this.currentStatusFilter === 'new') {
          pageTitle = this.currentFilter === 'podcasts' ? 'Novos Episódios de Podcasts' : (this.currentFilter === 'articles' ? 'Novos Artigos & Notícias' : 'Novos Feeds & Podcasts');
        } else if (this.currentStatusFilter === 'completed') {
          pageTitle = this.currentFilter === 'podcasts' ? 'Podcasts Concluídos (Ouvidos)' : (this.currentFilter === 'articles' ? 'Artigos Concluídos (Lidos)' : 'Conteúdos Concluídos');
        }

        if (this.searchQuery) {
          pageTitle = 'Resultado da Pesquisa';
        }

        let pageSubtitle = `${totalItems} ${totalItems === 1 ? 'item disponível' : 'itens disponíveis'} • Página ${this.currentPage} de ${totalPages}`;
        if (this.searchQuery) {
          pageSubtitle = `${totalItems} ${totalItems === 1 ? 'resultado encontrado' : 'resultados encontrados'} para "${Security.escapeHTML(this.searchQuery)}" • Página ${this.currentPage} de ${totalPages}`;
        }

        this.outlet.innerHTML = `
          <div class="page-container">
            <div class="section-header">
              <div>
                <h1 class="section-title">${pageTitle}</h1>
                <p class="section-subtitle">${pageSubtitle}</p>
              </div>
              <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                ${(this.searchQuery || this.currentStatusFilter !== 'all') ? `
                  <button class="btn btn-outline btn-pill" id="btn-back-home" title="Voltar ao início e limpar filtros">
                    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Voltar ao Início</span>
                  </button>
                ` : ''}

                <!-- Alternador Cards / Lista -->
                <div class="view-mode-toggle" title="Modo de visualização">
                  <button class="btn-view-mode ${this.viewMode === 'cards' ? 'active' : ''}" data-mode="cards" title="Visualização em Cards">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
                  </button>
                  <button class="btn-view-mode ${this.viewMode === 'list' ? 'active' : ''}" data-mode="list" title="Visualização em Lista">
                    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                  </button>
                </div>

                <button class="btn btn-outline btn-pill" id="btn-refresh-page">
                  <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                  <span>Atualizar</span>
                </button>
              </div>
            </div>

            <!-- Resume Playback Banner (Continuar de onde parou) -->
            ${(() => {
              const last = playerController ? playerController.getLastPlayback() : null;
              if (!last || !last.item) return '';
              if (playerController.currentItem && playerController.currentItem.id === last.item.id && !playerController.audio.paused) return '';

              const item = last.item;
              const progressPct = last.duration ? Math.min(100, Math.round((last.currentTime / last.duration) * 100)) : 0;
              const timeInfo = `${playerController.formatTime(last.currentTime)} de ${playerController.formatTime(last.duration)} (${progressPct}%)`;
              const cover = item.imageUrl || playerController.getDefaultCover();

              return `
                <div class="resume-playback-card" id="resume-playback-banner">
                  <div class="resume-playback-left">
                    <img src="${cover}" class="resume-playback-thumb" alt="${Security.escapeHTML(item.title)}" onerror="this.src='${playerController.getDefaultCover()}'">
                    <div class="resume-playback-info">
                      <div class="resume-playback-badge">
                        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <span>Continuar de onde você parou</span>
                      </div>
                      <div class="resume-playback-title" title="${Security.escapeHTML(item.title)}">${Security.escapeHTML(item.title)}</div>
                      <div class="resume-playback-meta">
                        <span>${Security.escapeHTML(item.author || 'Podcast')}</span>
                        <span>•</span>
                        <span>${timeInfo}</span>
                      </div>
                      <div class="resume-playback-progress-bar">
                        <div class="resume-playback-progress-fill" style="width: ${progressPct}%"></div>

                      <span>Continuar (${playerController.formatTime(last.currentTime)})</span>
                    </button>
                    <button class="btn-icon" id="btn-dismiss-resume" title="Dispensar sugestão" style="width: 32px; height: 32px;">
                      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                  </div>
                </div>
              `;
            })()}

            <!-- Single Line Filters Bar -->
            <div class="filters-container">
              <div class="filters-bar">
                <span class="filter-chip ${this.currentFilter === 'all' ? 'active' : ''}" data-filter="all">Todos (${countTypeAll})</span>
                <span class="filter-chip ${this.currentFilter === 'podcasts' ? 'active' : ''}" data-filter="podcasts">Podcasts (${countTypePodcasts})</span>
                <span class="filter-chip ${this.currentFilter === 'articles' ? 'active' : ''}" data-filter="articles">Artigos (${countTypeArticles})</span>
                <span class="filters-divider"></span>
                <span class="filter-chip filter-chip-status ${this.currentStatusFilter === 'all' ? 'active' : ''}" data-status-filter="all">Todos os Status (${countStatusAll})</span>
                <span class="filter-chip filter-chip-status ${this.currentStatusFilter === 'in_progress' ? 'active' : ''}" data-status-filter="in_progress">
                  <svg viewBox="0 0 24 24" style="width: 12px; height: 12px; display: inline-block; vertical-align: -1px; margin-right: 3px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Em Andamento (${countInProgress})
                </span>
                <span class="filter-chip filter-chip-status ${this.currentStatusFilter === 'new' ? 'active' : ''}" data-status-filter="new">
                  <span class="unread-dot" style="display: inline-block; vertical-align: middle; margin-right: 4px;"></span>Novos (${countNew})
                </span>
                <span class="filter-chip filter-chip-status ${this.currentStatusFilter === 'completed' ? 'active' : ''}" data-status-filter="completed">
                  <svg viewBox="0 0 24 24" style="width: 12px; height: 12px; display: inline-block; vertical-align: -1px; margin-right: 3px;"><polyline points="20 6 9 17 4 12"></polyline></svg>Concluídos (${countCompleted})
                </span>
              </div>
            </div>

            ${pageItems.length === 0 ? `
              <div class="empty-state">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <div class="empty-title">${this.searchQuery ? 'Nenhum resultado encontrado' : 'Nenhum item encontrado'}</div>
                <p>${this.searchQuery ? `Não foram encontrados itens para "<strong>${Security.escapeHTML(this.searchQuery)}</strong>" com os filtros atuais.` : 'Não há itens correspondentes aos filtros selecionados no momento.'}</p>
                ${(this.searchQuery || this.currentFilter !== 'all' || this.currentStatusFilter !== 'all') ? `
                  <button class="btn btn-primary btn-pill" id="btn-empty-back-home" style="margin-top: 1.25rem;">
                    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Limpar Filtros e Voltar</span>

              </div>
            ` : `
              ${this.viewMode === 'cards' ? `
                <div class="items-grid">
                  ${pageItems.map(item => this.renderItemCard(item)).join('')}
                </div>
              ` : `
                <div class="items-list">
                  ${pageItems.map(item => this.renderItemRow(item)).join('')}
                </div>
              `}

              <!-- Pagination Controls (10 items per page) -->
              ${this.renderPaginationControls(this.currentPage, totalPages, totalItems)}
            `}
          </div>
        `;

        this.bindCardEvents();
        this.bindViewModeEvents();
        this.bindFilterChipEvents();
        this.bindPaginationEvents(totalPages);

        document.getElementById('btn-resume-playback-action')?.addEventListener('click', () => {
          playerController.resumeLastPlayback();
          document.getElementById('resume-playback-banner')?.remove();
        });

        document.getElementById('btn-dismiss-resume')?.addEventListener('click', () => {
          playerController.clearPlaybackPosition();
          document.getElementById('resume-playback-banner')?.remove();
        });

        const resetHomeAction = () => {
          this.searchQuery = '';
          if (this.searchInput) this.searchInput.value = '';
          this.currentFilter = 'all';
          this.currentStatusFilter = 'all';
          this.currentPage = 1;
          window.location.hash = '#/';
          this.renderHome();
        };

        document.getElementById('btn-back-home')?.addEventListener('click', resetHomeAction);
        document.getElementById('btn-empty-back-home')?.addEventListener('click', resetHomeAction);
        document.getElementById('btn-refresh-page')?.addEventListener('click', () => this.syncAllFeeds());

        this.observeSeenItems();
      }

      // --- VIEW 1.5: CONTEÚDO SALVO (Itens salvos para ver/ouvir depois, ordenados do mais novo para o mais antigo) ---

                <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
                <div class="empty-title">Nenhum Conteúdo Salvo</div>
                <p style="margin-bottom: 1.5rem;">Você ainda não guardou nenhum artigo ou podcast para ver depois.<br>Clique no ícone de salvar em qualquer publicação para encontrá-la facilmente aqui.</p>
                <a href="#/" class="btn btn-primary btn-pill">Explorar Início</a>
              </div>
            </div>
          `;
          return;
        }

        // Base items matching search query
        let searchBase = savedItems;

      bindViewModeEvents() {

      renderPaginationControls(currentPage, totalPages, totalItems) {
        if (totalPages <= 1) return '';

        let pages = [];
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            pages.push(i);
          } else if (pages[pages.length - 1] !== '...') {
            pages.push('...');
          }
        }

        return `
          <div class="pagination">
            <button class="page-btn" id="pg-first" ${currentPage === 1 ? 'disabled' : ''} title="Primeira página">&laquo;</button>
            <button class="page-btn" id="pg-prev" ${currentPage === 1 ? 'disabled' : ''} title="Página anterior">&lsaquo;</button>
            
            ${pages.map(p => {
              if (p === '...') return `<span class="page-info">...</span>`;
              return `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
            }).join('')}

            <button class="page-btn" id="pg-next" ${currentPage === totalPages ? 'disabled' : ''} title="Próxima página">&rsaquo;</button>
            <button class="page-btn" id="pg-last" ${currentPage === totalPages ? 'disabled' : ''} title="Última página">&raquo;</button>
            <span class="page-info">${totalItems} itens (10 por pág)</span>
          </div>
        `;
      }

      bindPaginationEvents(totalPages, onPageChange = null) {
        const trigger = onPageChange || (() => this.renderHome());
        document.getElementById('pg-first')?.addEventListener('click', () => {
          this.currentPage = 1;
          trigger();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.getElementById('pg-prev')?.addEventListener('click', () => {
          if (this.currentPage > 1) {
            this.currentPage--;
            trigger();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
        document.getElementById('pg-next')?.addEventListener('click', () => {
          if (this.currentPage < totalPages) {
            this.currentPage++;
            trigger();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
        document.getElementById('pg-last')?.addEventListener('click', () => {
          this.currentPage = totalPages;
          trigger();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.currentPage = parseInt(e.target.getAttribute('data-page'), 10);
            trigger();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
      }

        document.querySelectorAll('.filter-chip[data-filter]').forEach(chip => {
          chip.addEventListener('click', (e) => {
            const filter = e.currentTarget.getAttribute('data-filter');
            if (filter === this.currentFilter) return;
            this.currentPage = 1;
            if (this.searchQuery) {
              this.currentFilter = filter;
              this.renderHome();
            } else {
              if (filter === 'all') window.location.hash = '#/';
              else if (filter === 'podcasts') window.location.hash = '#/podcasts';
              else if (filter === 'articles') window.location.hash = '#/articles';
            }
          });

        // Status filter chips (Todos os Status, Em Andamento, Novos, Concluídos)
        document.querySelectorAll('.filter-chip-status[data-status-filter]').forEach(chip => {
          chip.addEventListener('click', (e) => {
            const statusFilter = e.currentTarget.getAttribute('data-status-filter');

            this.currentStatusFilter = statusFilter;

      observeSeenItems() {
        if (!('IntersectionObserver' in window)) {
          setTimeout(() => {
            const ids = Array.from(document.querySelectorAll('.item-card[data-item-id], .item-list-row[data-item-id]'))
              .map(el => el.getAttribute('data-item-id'))
              .filter(Boolean);
            SeenTracker.markBatchSeen(ids);
          }, 1200);
          return;
        }

        if (this._seenObserver) {
          this._seenObserver.disconnect();
        }

        this._seenObserver = new IntersectionObserver((entries, observer) => {
          const idsToMark = [];
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const id = entry.target.getAttribute('data-item-id');
              if (id) {
                idsToMark.push(id);
                observer.unobserve(entry.target);
              }
            }
          });
          if (idsToMark.length) {
            SeenTracker.markBatchSeen(idsToMark);
          }
        }, {
          root: null,
          rootMargin: '0px',
          threshold: 0.25
        });

        document.querySelectorAll('.item-card[data-item-id], .item-list-row[data-item-id]').forEach(el => {
          const id = el.getAttribute('data-item-id');
          if (id && !SeenTracker.isSeen(id)) {
            this._seenObserver.observe(el);
          }
        });
      }

      bindCardEvents() {
        document.querySelectorAll('.btn-card-play').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const itemId = btn.getAttribute('data-item-id');
            const item = await db.getItem(itemId);
            if (item) playerController.load(item);
          });
        });

        document.querySelectorAll('.btn-card-dl').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const url = btn.getAttribute('data-url');
            const title = btn.getAttribute('data-title');
            playerController.downloadAudio(url, title);
          });
        });

        document.querySelectorAll('.btn-toggle-save').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            e.preventDefault();
            const itemId = btn.getAttribute('data-item-id');
            if (!itemId) return;
            const item = await db.getItem(itemId);
            if (!item) return;

            item.isSaved = !item.isSaved;
            item.savedAt = item.isSaved ? Date.now() : null;
            await db.updateItem(item);

            const isSaved = item.isSaved;
            Toast.show(isSaved ? 'Item guardado em "Conteúdo Salvo"!' : 'Item removido dos Conteúdos Salvos.', isSaved ? 'success' : 'info');

            // Update all toggle-save buttons on the current screen for this item
            document.querySelectorAll(`.btn-toggle-save[data-item-id="${CSS.escape(itemId)}"]`).forEach(b => {
              b.classList.toggle('is-saved', isSaved);
              b.title = isSaved ? 'Remover dos Conteúdos Salvos' : 'Salvar para ver depois';
              const svg = b.querySelector('svg');
              if (svg) {
                svg.style.color = isSaved ? 'var(--primary)' : '';
                svg.style.fill = isSaved ? 'var(--primary)' : '';
                const path = svg.querySelector('path');
                if (path) path.setAttribute('fill', isSaved ? 'currentColor' : 'none');
              }
              const labelSpan = b.querySelector('span');
              if (labelSpan) {
                labelSpan.textContent = isSaved ? 'Salvo para Depois' : 'Salvar para Depois';
                b.style.color = isSaved ? 'var(--primary)' : '';
                b.style.borderColor = isSaved ? 'var(--primary)' : '';
                b.style.background = isSaved ? 'var(--primary-light)' : '';
              }
            });
            await this.updateSavedCountBadge();

            // If we are currently in the saved view and an item was removed, re-render
            if (window.location.hash === '#/saved' && !isSaved) {
              await this.renderSavedView();
            }
          });
        });
      }

      bindLibraryEvents() {
        // Open Add Modal
        document.getElementById('btn-open-add-modal')?.addEventListener('click', () => this.showAddChannelModal());
        document.getElementById('btn-empty-add-modal')?.addEventListener('click', () => this.showAddChannelModal());

        // Library Filter Chips
        document.querySelectorAll('[data-lib-filter]').forEach(chip => {
          chip.addEventListener('click', () => {
            this.libraryFilter = chip.getAttribute('data-lib-filter');
            this.renderLibrary();
          });
        });

        // Single Sync Button
        document.querySelectorAll('.btn-sync-single').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id');
            const ch = await db.getChannel(id);
            if (!ch) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner" style="width: 14px; height: 14px;"></span>';
            try {
              const xml = await Fetcher.fetchFeed(ch.url);
              const parsed = FeedParser.parse(xml, ch.url, ch.isPodcast);
              ch.title = parsed.channel.title || ch.title;
              ch.description = parsed.channel.description || ch.description;
              ch.imageUrl = parsed.channel.imageUrl || ch.imageUrl;
              ch.itemCount = parsed.items.length;
              ch.lastUpdated = Date.now();

              await db.putChannel(ch);
              await db.putItems(parsed.items);
              Toast.show(`Canal "${ch.title}" atualizado com sucesso!`, 'success');
              await this.renderLibrary();
            } catch (err) {
              Toast.show(`Erro ao atualizar: ${err.message}`, 'error');
              btn.disabled = false;
              btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>';
            }
          });
        });

        // Edit Channel Modal
        document.querySelectorAll('.btn-edit-single').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id');
            const ch = await db.getChannel(id);
            if (!ch) return;
            this.showEditChannelModal(ch);
          });
        });

        // Delete Channel Modal
        document.querySelectorAll('.btn-del-single').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const title = btn.getAttribute('data-title');
            this.showDeleteConfirmModal(id, title);
          });
        });

        // Import OPML
        const importInput = document.getElementById('input-import-opml');
        importInput?.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          await this.importOPML(file);
          importInput.value = '';
        });

        // Export OPML
        document.getElementById('btn-export-opml')?.addEventListener('click', async () => {
          const channels = await db.getAllChannels();
          if (!channels.length) {
            Toast.show('Não há canais para exportar.', 'info');
            return;
          }
          this.exportOPML(channels);
        });
      }

                </div>

                <div class="form-group">
                  <label class="checkbox-label" style="background: var(--bg-surface-elevated); padding: 0.85rem 1rem; border-radius: var(--radius-md); display: flex; align-items: flex-start; gap: 0.75rem;">
                    <input type="checkbox" id="modal-input-is-podcast" checked style="margin-top: 0.2rem;">
                    <div>
                      <span style="font-weight: 600; color: var(--text-main); display: block;">Classificar como Podcast</span>
                      <span style="font-size: 0.78rem; color: var(--text-dim); display: block; margin-top: 0.2rem; line-height: 1.4;">
                        Ativa o reprodutor de áudio integrado, opções de download direto de arquivos .mp3 e leitura avançada de metadados do feed (duração, capa do episódio, autor).
                      </span>
                    </div>
                  </label>
                </div>

                <div class="form-group">
                  <label class="form-label" for="modal-input-custom-title">Título Customizado (Opcional)</label>
                  <input type="text" id="modal-input-custom-title" placeholder="Ex: Meu Podcast Favorito (deixe em branco para usar o título original)">
                  <div class="form-hint">Se não for informado, o título oficial do feed RSS será utilizado automaticamente.</div>
                </div>

                <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.75rem;">
                  <button type="button" class="btn btn-outline btn-pill" id="btn-cancel-modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary btn-pill" id="btn-submit-add-modal">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Buscar e Salvar Canal</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;

        const closeModal = () => { modalContainer.innerHTML = ''; };
        document.getElementById('btn-close-modal')?.addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal')?.addEventListener('click', closeModal);
        document.getElementById('modal-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'modal-backdrop') closeModal();
        });

        // Sample feed chips click
        modalContainer.querySelectorAll('.sample-feed-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const url = chip.getAttribute('data-url');
            const isPodcast = chip.getAttribute('data-podcast') === 'true';
            const urlInput = document.getElementById('modal-input-url');
            const podcastInput = document.getElementById('modal-input-is-podcast');
            if (urlInput) urlInput.value = url;
            if (podcastInput) podcastInput.checked = isPodcast;
          });
        });

        const form = document.getElementById('form-add-channel-modal');
        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('btn-submit-add-modal');
          const originalBtnHtml = submitBtn.innerHTML;
          const url = document.getElementById('modal-input-url').value.trim();
          const isPodcast = document.getElementById('modal-input-is-podcast').checked;
          const customTitle = document.getElementById('modal-input-custom-title').value.trim();

          if (!url) {
            Toast.show('Por favor, informe a URL do feed RSS.', 'warning');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner" style="width: 16px; height: 16px;"></span> <span>Buscando Feed...</span>';

          try {
            Toast.show('Obtendo dados do feed RSS...', 'info');
            const xmlText = await Fetcher.fetchFeed(url);
            const parsed = FeedParser.parse(xmlText, url, isPodcast);

            if (customTitle) {
              parsed.channel.title = customTitle;
            }

            await db.putChannel(parsed.channel);
            if (parsed.items.length > 0) {
              await db.putItems(parsed.items);
            }

            Toast.show(`Canal "${parsed.channel.title}" cadastrado com sucesso! (${parsed.items.length} itens)`, 'success', 4000);
            closeModal();
            await this.updateSidebarChannels();

            const hash = window.location.hash;
            if (hash.startsWith('#/library')) {
              await this.renderLibrary();
            } else if (hash === '' || hash === '#/' || hash === '#/podcasts' || hash === '#/articles') {
              await this.renderHome();
            } else {
              window.location.hash = `#/channel/${encodeURIComponent(parsed.channel.id)}`;
            }
          } catch (err) {
            console.error('Erro ao adicionar canal:', err);
            Toast.show(`Erro ao processar o feed: ${err.message}`, 'error', 5000);
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnHtml;
          }
        });
      }

      showEditChannelModal(channel) {
        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = `
          <div class="modal-backdrop" id="modal-backdrop">
            <div class="modal-content">
              <div class="modal-header">
                <h3 class="modal-title">Editar Canal</h3>
                <button class="btn-icon" id="btn-close-modal">&times;</button>
              </div>
              <form id="form-edit-channel">
                <div class="form-group">
                  <label class="form-label" for="edit-title">Título do Canal</label>
                  <input type="text" id="edit-title" value="${Security.escapeHTML(channel.title)}" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-url">URL do Feed RSS</label>
                  <input type="url" id="edit-url" value="${Security.escapeHTML(channel.url)}" required>
                </div>
                <div class="form-group">
                  <label class="checkbox-label" style="background: var(--bg-surface-elevated); padding: 0.85rem 1rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.75rem;">
                    <input type="checkbox" id="edit-is-podcast" ${channel.isPodcast ? 'checked' : ''}>
                    <span style="font-weight: 600; color: var(--text-main);">Classificar como Podcast</span>
                  </label>
                </div>
                <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.75rem;">
                  <button type="button" class="btn btn-outline btn-pill" id="btn-cancel-modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary btn-pill">Salvar Alterações</button>
                </div>
              </form>
            </div>
          </div>
        `;

        const closeModal = () => { modalContainer.innerHTML = ''; };
        document.getElementById('btn-close-modal')?.addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal')?.addEventListener('click', closeModal);
        document.getElementById('modal-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'modal-backdrop') closeModal();
        });

        document.getElementById('form-edit-channel')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          channel.title = document.getElementById('edit-title').value.trim();
          channel.url = document.getElementById('edit-url').value.trim();
          channel.isPodcast = document.getElementById('edit-is-podcast').checked;
          
          await db.putChannel(channel);
          Toast.show('Canal atualizado com sucesso!', 'success');
          closeModal();
          await this.updateSidebarChannels();
          await this.renderLibrary();
        });
      }

      showDeleteConfirmModal(channelId, channelTitle) {
        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = `
          <div class="modal-backdrop" id="modal-delete-backdrop">
            <div class="modal-content">
              <div class="modal-header">
                <h3 class="modal-title" style="color: var(--danger);">Remover Canal</h3>
              </div>
              <p style="margin-bottom: 1rem; color: var(--text-muted);">
                Tem certeza que deseja remover o canal <strong>${Security.escapeHTML(channelTitle)}</strong> da sua biblioteca?
                Todas as publicações e episódios salvos em cache também serão excluídos.
              </p>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="btn-cancel-del">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-del">Sim, Excluir</button>
              </div>
            </div>
          </div>
        `;

        const closeModal = () => { modalContainer.innerHTML = ''; };
        document.getElementById('btn-cancel-del')?.addEventListener('click', closeModal);
        document.getElementById('modal-delete-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'modal-delete-backdrop') closeModal();
        });

        document.getElementById('btn-confirm-del')?.addEventListener('click', async () => {
          await db.deleteChannel(channelId);
          Toast.show(`Canal "${channelTitle}" removido com sucesso.`, 'info');
          closeModal();
          await this.updateSidebarChannels();
          await this.renderLibrary();
        });
      }

      exportOPML(channels) {
        let opml = `<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n  <head>\n    <title>FollowRSS Subscriptions</title>\n    <dateCreated>${new Date().toUTCString()}</dateCreated>\n  </head>\n  <body>\n`;
        for (const ch of channels) {
          opml += `    <outline text="${Security.escapeHTML(ch.title)}" title="${Security.escapeHTML(ch.title)}" type="rss" xmlUrl="${Security.escapeHTML(ch.url)}" htmlUrl="${Security.escapeHTML(ch.link || ch.url)}" isPodcast="${ch.isPodcast ? 'true' : 'false'}" />\n`;
        }
        opml += `  </body>\n</opml>`;

        const blob = new Blob([opml], { type: 'text/xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `followrss-export-${Date.now()}.opml`;
        a.click();
        URL.revokeObjectURL(url);
        Toast.show('Backup OPML exportado com sucesso!', 'success');
      }

      async importOPML(file) {
        try {
          Toast.show('Lendo arquivo OPML...', 'info');
          const text = await file.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(text, 'text/xml');

          const parseError = xmlDoc.querySelector('parsererror');
          if (parseError) {
            throw new Error('Formato XML do arquivo OPML inválido.');
          }

          const outlines = Array.from(xmlDoc.querySelectorAll('outline'));
          const feedsToImport = [];

          for (const outline of outlines) {
            const xmlUrl = outline.getAttribute('xmlUrl') || outline.getAttribute('xmlurl') || outline.getAttribute('url');
            if (xmlUrl) {
              const title = outline.getAttribute('text') || outline.getAttribute('title') || 'Canal Importado';
              const htmlUrl = outline.getAttribute('htmlUrl') || outline.getAttribute('htmlurl') || '';
              const isPodcastAttr = outline.getAttribute('isPodcast');
              const isAudioType = outline.getAttribute('type') === 'audio';
              const hasPodcastKeyword = xmlUrl.toLowerCase().includes('podcast') || title.toLowerCase().includes('podcast');
              const isPodcast = isPodcastAttr === 'true' || isAudioType || hasPodcastKeyword;

              feedsToImport.push({
                url: xmlUrl.trim(),
                title: title.trim(),
                link: htmlUrl.trim() || xmlUrl.trim(),
                isPodcast
              });
            }
          }

          if (feedsToImport.length === 0) {
            Toast.show('Nenhum feed válido encontrado no arquivo OPML.', 'warning');
            return;
          }

          const existingChannels = await db.getAllChannels();
          const existingUrls = new Set(existingChannels.map(c => c.url));
          let addedCount = 0;
          let skippedCount = 0;

          for (const item of feedsToImport) {
            if (!existingUrls.has(item.url)) {
              await db.putChannel({
                id: item.url,
                url: item.url,
                title: item.title,
                link: item.link,
                description: 'Importado de backup OPML',
                imageUrl: '',
                isPodcast: item.isPodcast,
                itemCount: 0,
                lastUpdated: Date.now()
              });
              existingUrls.add(item.url);
              addedCount++;
            } else {
              skippedCount++;
            }
          }

          await this.updateSidebarChannels();
          await this.renderLibrary();

          if (addedCount > 0) {
            Toast.show(`${addedCount} novos canais importados do OPML! Sincronizando conteúdos...`, 'success', 4000);
            this.syncAllFeeds();
          } else {
            Toast.show(`Todos os ${skippedCount} canais do arquivo já constam na biblioteca.`, 'info');
          }
        } catch (err) {
          console.error('Erro ao importar OPML:', err);
          Toast.show(`Falha ao importar OPML: ${err.message}`, 'error');
        }
      }

      renderNotFound() {
        this.outlet.innerHTML = `
          <div class="page-container">
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              <div class="empty-title">Página Não Encontrada</div>
              <p>O conteúdo ou canal que você tentou acessar não existe ou foi removido.</p>
              <a href="#/" class="btn btn-primary btn-pill" style="margin-top: 1rem;">Voltar para o Início</a>
            </div>
          </div>
        `;
      }
    }

    // --- INITIALIZE APPLICATION ---
    let playerController;
    let appRouter;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await db.init();
        await DownloadManager.init();
        playerController = new AudioPlayerController();
        appRouter = new AppRouter();

        // Safe Service Worker Registration for PWA support (only on HTTP/HTTPS)
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('sw.js', { scope: './' })
            .then(reg => console.log('FollowRSS Service Worker registrado com escopo:', reg.scope))
            .catch(err => console.debug('Service Worker não registrado:', err));
        }
      } catch (err) {
        console.error('Falha crítica na inicialização:', err);
        document.body.innerHTML = `
          <div style="padding: 2rem; color: #ef4444; font-family: sans-serif; text-align: center;">
            <h2>Falha ao inicializar banco de dados</h2>
            <p>O navegador bloqueou ou não oferece suporte a IndexedDB no momento.</p>
          </div>
        `;
      }
    });
  </script>
</body>
